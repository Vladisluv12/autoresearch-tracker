name: Coordination checks

on:
  push:
    branches-ignore: [coordination]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test independent agents and concurrent Git updates
        run: python -m unittest discover -s tests -v
